<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuideKit Vanilla Demo</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      code {
        background: #f1f5f9;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>GuideKit Vanilla Demo</h1>
    <p>This page loads the <code>@guidekit/vanilla</code> IIFE bundle and mounts the widget.</p>

    <script>
      // Temporary shim: the IIFE bundle currently references `module` (Node-style).
      // Defining it here keeps the browser bundle executable without polyfills.
      window.module = window.module || { exports: {} };
      // tsup sometimes aliases the Node `module` import as `module$1` in the IIFE wrapper.
      window.module$1 = window.module$1 || window.module;
    </script>
    <script src="/vanilla/guidekit-global"></script>
    <script>
      if (window.GuideKit && typeof window.GuideKit.init === 'function') {
        window.GuideKit.init({
        tokenEndpoint: '/api/guidekit/token',
        proxy: {
          llm: '/api/guidekit/llm',
          health: '/api/guidekit/health',
          stt: '/api/guidekit/stt',
          tts: '/api/guidekit/tts',
        },
        llm: { provider: 'gemini', model: 'gemini-2.5-flash-lite' },
        intelligence: false,
        agent: { name: 'GuideKit Assistant', greeting: 'Hello! How can I help you today?' },
        options: { debug: true, mode: 'text' },
        });
      }
    </script>
  </body>
</html>
