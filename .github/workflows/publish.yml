name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run (no upload)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-npm
  cancel-in-progress: true

jobs:
  publish:
    name: Publish @guidekit/* to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bash scripts/publish-packages.sh --dry-run
          else
            bash scripts/publish-packages.sh
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published core version
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          npm view "@guidekit/core@$VERSION" version

      - name: Verify published react version
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="$(node -p "require('./packages/react/package.json').version")"
          npm view "@guidekit/react@$VERSION" version
