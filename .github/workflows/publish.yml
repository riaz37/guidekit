name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'npm publish --dry-run (no upload)'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-npm
  cancel-in-progress: true

jobs:
  live-e2e:
    name: Live E2E (pre-publish)
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run live E2E suite
        env:
          LIVE_LLM: '1'
          SKIP_LIVE_VOICE: '1'
          GUIDEKIT_SECRET: guidekit-example-e2e-secret-32-chars
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SKIP_NPM_DRY_RUN: '1'
        run: pnpm check:release

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-live-e2e-report
          path: playwright-report/
          retention-days: 14

  publish:
    name: Publish @guidekit/* to npm
    needs: live-e2e
    if: ${{ always() && (inputs.dry_run || needs.live-e2e.result == 'success') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            bash scripts/publish-packages.sh --dry-run
          else
            bash scripts/publish-packages.sh
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published core version
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          npm view "@guidekit/core@$VERSION" version

      - name: Verify published react version
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="$(node -p "require('./packages/react/package.json').version")"
          npm view "@guidekit/react@$VERSION" version
